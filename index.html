<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--good:#059669;--bad:#dc2626;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--sub:#9aa0a6;--line:#2a2f37;--pri:#60a5fa;--good:#34d399;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
header h1{margin:0;font-size:16px}
#bar{font-size:13px;color:var(--sub)}
#bar b{color:var(--tx)}
nav{display:flex;gap:6px;margin-top:8px}
nav button{flex:1;padding:8px 4px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:8px;font-size:13px}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:12px;max-width:760px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px}
.card h3{margin:12px 0 4px;font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:block;margin-bottom:8px}
.f>span{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.f input,.f select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.f input[type=range]{padding:0;height:28px}
.mh{display:block;font-style:normal;font-size:12px;color:var(--pri);min-height:16px}
small,.hint{color:var(--sub);font-size:12px}
.auto{font-size:13px;color:var(--pri);margin-bottom:8px}
.full{grid-column:1/-1}
.comp{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.score{display:flex;align-items:center;gap:14px}
.big{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--pri);color:#fff;flex:none}
.big b{font-size:32px;line-height:1}.big span{font-size:12px}
.bars div{margin:6px 0;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rng{border:1px solid var(--line);border-radius:10px;padding:8px}
.rng h4{margin:0 0 6px;font-size:14px}
.rng .row{margin-bottom:8px}.rng .row span{display:block;font-size:12px;color:var(--sub)}.rng .row b{font-size:16px}.rng .row small{display:block}
.sell h4{color:var(--bad)}.buy h4{color:var(--good)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
button.act{padding:9px 12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:8px;font-size:14px}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.del{color:var(--bad)}
ul{margin:4px 0;padding-left:18px}
svg text{fill:var(--tx);font-size:10px}
svg .g{fill:none;stroke:var(--line)}svg .p{fill:rgba(37,99,235,.25);stroke:var(--pri);stroke-width:2}
</style>
</head>
<body>
<header>
  <h1>🏢 아파트 가치 점수 · 적정가</h1>
  <div id="bar">입력하면 바로 계산돼요</div>
  <nav>
    <button data-t="t1" class="on">① 기본·가격</button>
    <button data-t="t2">② 지표</button>
    <button data-t="t3">③ 결과</button>
    <button data-t="t4">④ 저장</button>
  </nav>
</header>
<main>

<section id="t1" class="on">
  <div class="card">
    <h2>대상 아파트</h2>
    <div class="grid">
      <label class="f full"><span>단지명 / 메모</span><input data-k="name" type="text" placeholder="예: 센텀 르엘 84A"></label>
      <label class="f"><span>구분</span><select data-k="type"><option value="built">준공 아파트</option><option value="pre">분양권</option></select></label>
      <label class="f"><span>전용면적 (㎡)</span><input data-k="area" inputmode="decimal" placeholder="84"></label>
      <label class="f" id="ageBox"><span>준공 경과 연수 (년)</span><input data-k="myAge" inputmode="decimal" placeholder="예: 8"></label>
    </div>
  </div>

  <div class="card">
    <h2>가격 기준 (만원 단위)</h2>
    <label class="f"><span>같은 단지·같은 평형 최근 실거래가</span><input data-k="anchor" inputmode="decimal" placeholder="예: 125000"><em class="mh" data-m="anchor"></em></label>
    <label class="f"><span>현재 호가 / 검토 중인 가격</span><input data-k="ask" inputmode="decimal" placeholder="예: 130000"><em class="mh" data-m="ask"></em></label>
    <label class="f"><span>전세 시세 (선택, 전세가율 자동계산)</span><input data-k="jeonsePrice" inputmode="decimal" placeholder="예: 70000"><em class="mh" data-m="jeonsePrice"></em></label>
  </div>

  <div class="card" id="preBox">
    <h2>분양권 정보</h2>
    <div class="grid">
      <label class="f"><span>분양가 (만원)</span><input data-k="pPrice" inputmode="decimal"><em class="mh" data-m="pPrice"></em></label>
      <label class="f"><span>기 납입금 (만원)</span><input data-k="pPaid" inputmode="decimal"><em class="mh" data-m="pPaid"></em></label>
      <label class="f"><span>입주까지 남은 개월</span><input data-k="pMonths" inputmode="decimal"></label>
      <label class="f"><span>양도세율 (%, 선택)</span><input data-k="taxRate" inputmode="decimal" placeholder="예: 60"></label>
    </div>
    <small>양도세율은 보유기간·시점·세법에 따라 달라서 직접 넣어 주세요. 세후 금액은 단순 추정이에요.</small>
  </div>

  <div class="card">
    <h2>비교 단지 (인근 3~5곳 권장)</h2>
    <small>같은 생활권의 최근 실거래를 넣으면 연식 차이를 보정해 ㎡당 가격으로 환산해요. 연식은 비워도 돼요.</small>
    <div id="comps"></div>
    <div class="auto" id="compOut"></div>
  </div>

  <div class="card">
    <h2>모델 설정</h2>
    <div class="grid">
      <label class="f"><span>같은 단지 실거래 비중 (%)</span><input data-k="anchorW" type="number"></label>
      <label class="f"><span>중립 점수 (이 점수면 보정 0%)</span><input data-k="neutral" type="number"></label>
      <label class="f"><span>점수 보정 최대 폭 (±%)</span><input data-k="maxAdj" type="number"></label>
    </div>
    <h3>카테고리 가중치</h3>
    <div class="grid" id="wbox"></div>
  </div>
  <button class="act pri" onclick="go('t2')">다음: 지표 입력 →</button>
</section>

<section id="t2">
  <div id="inds"></div>
  <button class="act pri" onclick="go('t3')">결과 보기 →</button>
</section>

<section id="t3">
  <div id="res"></div>
</section>

<section id="t4">
  <div class="card">
    <h2>현재 입력 저장</h2>
    <div style="display:flex;gap:8px"><button class="act pri" onclick="saveCur()">저장 / 같은 이름은 덮어쓰기</button><button class="act" onclick="resetAll()">새로 시작</button></div>
  </div>
  <div class="card"><h2>저장된 아파트 비교</h2><div id="saved"></div></div>
</section>

</main>

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function num(x){if(x===undefined||x===null||x==='')return null;const n=parseFloat(String(x).replace(/,/g,''));return isFinite(n)?n:null}
function interp(p,x){if(x<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++){if(x<=p[i][0]){const[a,b]=p[i-1],[c,d]=p[i];return b+(d-b)*(x-a)/(c-a)}}return p[p.length-1][1]}
function fmt(m){if(m===null||m===undefined||!isFinite(m))return '-';const r=Math.round(Math.abs(m)/100)*100;const e=Math.floor(r/10000),k=r%10000;const s=(e?e+'억 ':'')+(k?k.toLocaleString()+'만':(e?'':'0'));return (m<0?'-':'')+s.trim()+'원'}
function grade(s){return s>=85?'A+':s>=75?'A':s>=65?'B+':s>=55?'B':s>=45?'C':'D'}
function DEF(){return{name:'',type:'built',area:'84',myAge:'',anchor:'',ask:'',jeonsePrice:'',pPrice:'',pPaid:'',pMonths:'',taxRate:'',anchorW:60,neutral:60,maxAdj:8,w:{loc:30,sup:20,prc:15,inc:15,mkt:20},comps:[0,1,2,3,4].map(()=>({n:'',a:'',p:'',age:''})),v:{}}}
function calc(S){
  const pre=S.type==='pre';
  const area=num(S.area),anchor=num(S.anchor),ask=num(S.ask);
  const age=pre?0:num(S.myAge);
  const cl=[];
  S.comps.forEach(c=>{const p=num(c.p),a=num(c.a);if(p&&a){const ca=num(c.age);let f=1;if(ca!==null&&age!==null)f=1+clamp((ca-age)*0.008,-0.12,0.12);cl.push({n:c.n||'비교단지',raw:p/a,per:p/a*f})}});
  const pers=cl.map(x=>x.per).sort((a,b)=>a-b);
  const med=pers.length?(pers.length%2?pers[(pers.length-1)/2]:(pers[pers.length/2-1]+pers[pers.length/2])/2):null;
  const compBase=med&&area?med*area:null;
  const basis=anchor||ask;
  const items=[];
  const add=(d,score,raw)=>{if(score!==null&&score!==undefined)items.push({id:d.id,c:d.c,l:d.l,score:clamp(score,0,100),raw})};
  const auto={};
  IND.forEach(d=>{
    const v=S.v[d.id];
    if(d.t==='n'){const x=num(v);if(x!==null)add(d,interp(d.pts,x),x)}
    else if(d.t==='s'){const x=v===undefined||v===''?3:clamp(Math.round(num(v)||3),1,5);add(d,SL[x-1],x)}
    else if(d.t==='o'){if(v!==undefined&&v!==''&&d.o[+v]){add(d,d.o[+v][1],d.o[+v][0])}}
    else if(d.t==='a'){if(age!==null)add(d,interp(d.pts,age),age)}
    else if(d.id==='rel'){if(basis&&compBase){const r=(basis/compBase-1)*100;auto.rel=r;add(d,interp(d.pts,r),r)}}
  });
  // 전세가율 자동
  if(num(S.v.jeonse)===null){const jp=num(S.jeonsePrice);if(jp&&basis){const jr=jp/basis*100;auto.jeonse=jr;const d=IND.find(x=>x.id==='jeonse');add(d,interp(d.pts,jr),jr)}}
  const cats={};let ws=0,tot=0;
  Object.keys(CATS).forEach(k=>{
    const it=items.filter(x=>x.c===k);
    const s=it.length?it.reduce((a,b)=>a+b.score,0)/it.length:null;
    const w=num(S.w[k])||0;
    cats[k]={s,n:it.length,w};
    if(s!==null&&w>0){ws+=w;tot+=w*s}
  });
  const total=ws?tot/ws:null;
  // 적정가
  let base=null;const aw=clamp((num(S.anchorW)??60)/100,0,1);
  if(anchor&&compBase)base=anchor*aw+compBase*(1-aw);else base=anchor||compBase||null;
  const neutral=num(S.neutral)??60,maxAdj=(num(S.maxAdj)??8)/100;
  const adj=total===null?0:clamp((total-neutral)/40*maxAdj,-maxAdj,maxAdj);
  const F=base?base*(1+adj):null;
  const m1=cats.mkt.s,m2=cats.sup.s;
  const mo=clamp((((m1??50)+(m2??50))/2-50)/50,-1,1);
  const sell=F?[['도전가 (호가 시도)',F*(1.05+0.03*mo)],['현실 체결가',F*(1+0.01*mo)],['빠른 매도가',F*(0.97+0.01*mo)]]:[];
  const buy=F?[['상한 (이 이상은 비쌈)',F*(1+0.02*mo)],['협상 목표',F*(0.97+0.01*mo)],['급매 목표',F*(0.93+0.02*mo)]]:[];
  const diff=F&&ask?(ask/F-1)*100:null;
  return{pre,area,anchor,ask,age,cl,med,compBase,base,adj,F,mo,sell,buy,diff,items,cats,total,auto,used:items.length,all:IND.length+0}
}

let S=DEF();
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function get(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],S)}
function set(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
function go(t){$$('section').forEach(s=>s.classList.toggle('on',s.id===t));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));window.scrollTo(0,0);if(t==='t4')renderSaved()}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));

function buildStatic(){
  $('#comps').innerHTML=[0,1,2,3,4].map(i=>`<div class="comp"><div class="grid">
   <label class="f full"><span>비교단지 ${i+1} 이름</span><input data-k="comps.${i}.n" type="text"></label>
   <label class="f"><span>전용면적 (㎡)</span><input data-k="comps.${i}.a" inputmode="decimal"></label>
   <label class="f"><span>최근 실거래가 (만원)</span><input data-k="comps.${i}.p" inputmode="decimal"><em class="mh" data-m="comps.${i}.p"></em></label>
   <label class="f"><span>연식 (년, 선택)</span><input data-k="comps.${i}.age" inputmode="decimal"></label></div></div>`).join('');
  $('#wbox').innerHTML=Object.keys(CATS).map(k=>`<label class="f"><span>${CATS[k]}</span><input data-k="w.${k}" type="number"></label>`).join('');
  let h='';
  Object.keys(CATS).forEach(k=>{
    h+=`<div class="card"><h2>${CATS[k]} <small data-cs="${k}"></small></h2>`;
    IND.filter(d=>d.c===k).forEach(d=>{
      if(d.t==='n')h+=`<label class="f"><span>${d.l}</span><input data-k="v.${d.id}" inputmode="decimal" placeholder="${d.ph||''}"></label>${d.h?`<small>${d.h}</small>`:''}${d.id==='jeonse'?'<div class="auto" data-auto="jeonse"></div>':''}`;
      else if(d.t==='s')h+=`<label class="f"><span>${d.l} <b data-sv="${d.id}"></b></span><input type="range" min="1" max="5" step="1" data-k="v.${d.id}"></label><small>${d.h||''}</small>`;
      else if(d.t==='o')h+=`<label class="f"><span>${d.l}</span><select data-k="v.${d.id}"><option value="">모름 (제외)</option>${d.o.map((o,i)=>`<option value="${i}">${o[0]}</option>`).join('')}</select></label>`;
      else if(d.t==='a')h+=`<div class="auto" data-auto="age"></div>`;
      else h+=`<div class="auto" data-auto="rel"></div>`;
    });
    h+='</div>';
  });
  $('#inds').innerHTML=h;
}
function fill(){
  $$('[data-k]').forEach(el=>{let v=get(el.dataset.k);if(v===undefined||v===null||v==='')v=el.type==='range'?'3':'';el.value=v});
}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;set(k,e.target.value);refresh();persist()});

function refresh(){
  const R=calc(S);window.R=R;
  $('#preBox').style.display=R.pre?'block':'none';
  $('#ageBox').style.display=R.pre?'none':'block';
  $$('[data-m]').forEach(el=>{const x=num(get(el.dataset.m));el.textContent=x?'= '+fmt(x):''});
  $$('[data-sv]').forEach(el=>{const v=S.v[el.dataset.sv];el.textContent=(v===undefined||v===''?3:v)+'점'});
  $$('[data-cs]').forEach(el=>{const c=R.cats[el.dataset.cs];el.textContent=c.s===null?'':`· ${Math.round(c.s)}점 (${c.n}개 반영)`});
  const A=R.auto;
  const setA=(k,t)=>{const el=$(`[data-auto="${k}"]`);if(el)el.textContent=t};
  setA('age',R.age!==null?`연식 ${R.age}년 → 자동 반영`:'연식 미입력 (기본 탭에서 입력하면 반영)');
  setA('rel',A.rel!==undefined?`비교단지 환산가 대비 ${A.rel>=0?'+':''}${A.rel.toFixed(1)}% → 자동 반영`:'비교단지와 실거래가/호가를 입력하면 자동 반영');
  setA('jeonse',A.jeonse!==undefined?`전세가율 자동계산: ${A.jeonse.toFixed(1)}%`:'');
  $('#compOut').innerHTML=R.cl.length?`비교단지 ${R.cl.length}곳 · 보정 ㎡당 중앙값 <b>${Math.round(R.med).toLocaleString()}만</b>${R.compBase?` → 내 평형 환산 <b>${fmt(R.compBase)}</b>`:''}`:'';
  $('#bar').innerHTML=R.total===null?'지표를 입력하면 점수가 나와요':`종합 <b>${Math.round(R.total)}점(${grade(R.total)})</b> · 적정가 <b>${R.F?fmt(R.F):'가격 기준 필요'}</b>`;
  renderRes(R);
}
function radar(c){
  const keys=Object.keys(CATS),n=keys.length,cx=100,cy=100,r=68;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*v/100*Math.cos(a),cy+r*v/100*Math.sin(a)]};
  let g=[25,50,75,100].map(v=>`<polygon class="g" points="${keys.map((k,i)=>pt(i,v).join(',')).join(' ')}"/>`).join('');
  const poly=keys.map((k,i)=>pt(i,c[k].s??0).join(',')).join(' ');
  const lb=keys.map((k,i)=>{const[x,y]=pt(i,122);return`<text x="${x}" y="${y}" text-anchor="middle">${CATS[k]}</text>`}).join('');
  return`<svg viewBox="0 0 200 200" width="190" height="190">${g}<polygon class="p" points="${poly}"/>${lb}</svg>`;
}
function renderRes(R){
  if(R.total===null){$('#res').innerHTML='<div class="card">지표를 입력하면 결과가 표시돼요.</div>';return}
  const keys=Object.keys(CATS);
  let h=`<div class="card"><div class="score"><div class="big"><b>${Math.round(R.total)}</b><span>${grade(R.total)} 등급</span></div>
  <div class="bars" style="flex:1">${keys.map(k=>{const c=R.cats[k];return`<div>${CATS[k]} <b>${c.s===null?'-':Math.round(c.s)}</b> <small>(가중 ${c.w})</small><div class="bar"><i style="width:${c.s||0}%"></i></div></div>`}).join('')}</div></div>
  <div style="text-align:center">${radar(R.cats)}</div>
  <small>반영된 지표 ${R.used}개 / 전체 ${IND.length}개. 입력이 많을수록 정확해져요.</small></div>`;
  if(!R.F){h+=`<div class="card">⚠️ 적정가를 계산하려면 <b>같은 단지 실거래가</b> 또는 <b>비교단지 실거래가</b>를 입력해 주세요.</div>`}
  else{
    h+=`<div class="card"><h2>적정가 산출</h2><table>
    ${R.anchor?`<tr><td>같은 단지 실거래</td><td>${fmt(R.anchor)}</td></tr>`:''}
    ${R.compBase?`<tr><td>비교단지 환산가 (${R.cl.length}곳)</td><td>${fmt(R.compBase)}</td></tr>`:''}
    <tr><td>기준가 (가중평균)</td><td>${fmt(R.base)}</td></tr>
    <tr><td>점수 보정 (${Math.round(R.total)}점)</td><td>${R.adj>=0?'+':''}${(R.adj*100).toFixed(1)}%</td></tr>
    <tr><td><b>적정가</b></td><td><b style="font-size:18px">${fmt(R.F)}</b></td></tr></table>
    <small>시장 분위기(수급+시장환경) ${R.mo>=0.2?'우호적':R.mo<=-0.2?'부담':'중립'} → 아래 가격대에 반영</small></div>`;
    if(R.diff!==null){
      const d=R.diff,t=d<=-5?['저평가 (매수 매력)','var(--good)']:d<=5?['적정 수준','var(--pri)']:d<=12?['다소 고평가','var(--warn)']:['고평가','var(--bad)'];
      h+=`<div class="card"><h2>입력한 가격 ${fmt(R.ask)} 판정</h2><span class="tag" style="background:${t[1]}">${t[0]}</span> 적정가 대비 <b>${d>=0?'+':''}${d.toFixed(1)}%</b></div>`;
    }
    const pPrice=num(S.pPrice),pPaid=num(S.pPaid),tax=num(S.taxRate);
    const row=(r,isSell)=>{let x=`<div class="row"><span>${r[0]}</span><b>${fmt(r[1])}</b>`;
      if(R.pre&&pPrice){const p=r[1]-pPrice;x+=`<small>프리미엄 ${fmt(p)}</small>`;
        if(isSell&&tax!==null&&p>0)x+=`<small>세후 차익 약 ${fmt(p*(1-tax/100))}</small>`;
        if(!isSell&&pPaid!==null)x+=`<small>초기 현금 약 ${fmt(r[1]-(pPrice-pPaid))}</small>`}
      return x+'</div>'};
    h+=`<div class="card"><h2>가격대</h2><div class="two">
    <div class="rng sell"><h4>📤 매도 가능가</h4>${R.sell.map(r=>row(r,true)).join('')}</div>
    <div class="rng buy"><h4>📥 매수 가능가</h4>${R.buy.map(r=>row(r,false)).join('')}</div></div>
    ${R.pre&&pPrice&&pPaid!==null?`<small>분양권 매수 시 입주까지 추가 납부할 잔금: ${fmt(pPrice-pPaid)}${num(S.pMonths)?` (약 ${num(S.pMonths)}개월 후)`:''}</small>`:''}</div>`;
  }
  const so=[...R.items].sort((a,b)=>b.score-a.score);
  h+=`<div class="card"><h2>강점 / 약점</h2><h3>👍 강점</h3><ul>${so.slice(0,3).map(x=>`<li>${x.l} (${Math.round(x.score)}점)</li>`).join('')}</ul><h3>👎 약점</h3><ul>${so.slice(-3).reverse().map(x=>`<li>${x.l} (${Math.round(x.score)}점)</li>`).join('')}</ul></div>
  <div class="card"><small>※ 이 결과는 입력값과 단순 규칙으로 계산한 참고용 추정치예요. 실제 거래가는 층·동·호실·급매 여부·협상에 따라 달라지므로, 최종 판단 전 최신 실거래가와 중개사 시세를 꼭 확인하세요. 투자 자문이 아닙니다.</small></div>`;
  $('#res').innerHTML=h;
}

const KC='aptvalue.cur.v1',KL='aptvalue.list.v1';
function persist(){try{localStorage.setItem(KC,JSON.stringify(S))}catch(e){}}
function loadList(){try{return JSON.parse(localStorage.getItem(KL)||'[]')}catch(e){return[]}}
function saveCur(){const n=(S.name||'').trim();if(!n){alert('기본 탭에서 단지명을 먼저 입력해 주세요.');return}
  const L=loadList().filter(x=>x.name!==n);L.push({name:n,s:JSON.parse(JSON.stringify(S))});
  try{localStorage.setItem(KL,JSON.stringify(L))}catch(e){alert('저장 실패')}renderSaved()}
function renderSaved(){
  const L=loadList();
  if(!L.length){$('#saved').innerHTML='<small>저장된 항목이 없어요.</small>';return}
  $('#saved').innerHTML=`<table><tr><th>단지</th><th>점수</th><th>적정가</th><th></th></tr>${L.map((x,i)=>{const r=calc(x.s);return`<tr><td>${x.name}${r.pre?' (분양권)':''}</td><td>${r.total===null?'-':Math.round(r.total)+' '+grade(r.total)}</td><td>${r.F?fmt(r.F):'-'}</td><td><button class="act" onclick="loadItem(${i})">불러오기</button> <button class="act del" onclick="delItem(${i})">삭제</button></td></tr>`}).join('')}</table>`;
}
function loadItem(i){const x=loadList()[i];if(!x)return;S=Object.assign(DEF(),x.s);fill();refresh();persist();go('t3')}
function delItem(i){const L=loadList();L.splice(i,1);try{localStorage.setItem(KL,JSON.stringify(L))}catch(e){}renderSaved()}
function resetAll(){if(!confirm('입력을 모두 지우고 새로 시작할까요?'))return;S=DEF();fill();refresh();persist();go('t1')}
buildStatic();
try{const c=JSON.parse(localStorage.getItem(KC)||'null');if(c)S=Object.assign(DEF(),c)}catch(e){}
fill();refresh();
</script>
